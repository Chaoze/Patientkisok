plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.patientkiosk.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.patientkiosk.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
